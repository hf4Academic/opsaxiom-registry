# PR 质检 + 合入后自动重建索引（"合入即上架"）。
# 校验工具来自 OpsAxiom 主仓库（hf4Academic/opsaxiom，public）。
name: registry
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout registry
        uses: actions/checkout@v4
        with:
          path: registry
      - name: checkout opsaxiom tools
        uses: actions/checkout@v4
        with:
          repository: hf4Academic/opsaxiom
          path: opsaxiom
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r opsaxiom/tools/requirements.txt
      # 每个收录的 skill 重跑完整校验（结构+语义 S1-S13+语法树），不绿不合
      - name: validate all skills
        run: |
          set -e
          for d in registry/skills/*/*/; do
            python opsaxiom/tools/validate.py "$d"
          done
      # draft 拒收（policy.md 第 2 条）
      - name: reject drafts
        run: |
          if grep -rl "maturity: *draft" registry/skills/; then
            echo "::error::registry 拒收 draft（policy.md）"; exit 1
          fi
          echo "no drafts ✔"
      # 个人层拒收（docs/13 §4：local. 前缀 / visibility:local 永不出门）
      - name: reject local skills
        run: |
          if grep -rlE "visibility: *local" registry/skills/ \
             || ls registry/skills/ 2>/dev/null | grep -q "^local\."; then
            echo "::error::registry 拒收个人层 Skill（local./visibility:local，docs/13 §4）"; exit 1
          fi
          echo "no local skills ✔"

  rebuild-index:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout registry
        uses: actions/checkout@v4
        with:
          path: registry
      - name: checkout opsaxiom tools
        uses: actions/checkout@v4
        with:
          repository: hf4Academic/opsaxiom
          path: opsaxiom
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r opsaxiom/tools/requirements.txt
      - name: rebuild index.json
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'opsaxiom/tools')
          import hubtool
          n = hubtool.build_registry('registry/skills', '/tmp/rebuild', include_draft=False)
          print(f'rebuilt index: {n} skills')
          PY
          cp /tmp/rebuild/index.json registry/index.json
          cd registry
          git config user.name "registry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "ci: rebuild index.json"
          git push
